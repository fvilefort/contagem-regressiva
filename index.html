<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Jornada do Tempo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: #fff;
            overflow: hidden;
            transition: background 1s ease;
        }

        /* Container Principal */
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 500px;
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        /* Estilo do Cronômetro */
        .countdown {
            display: flex;
            justify-content: space-around;
            margin-bottom: 1.5rem;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            width: 22%;
        }

        .number {
            font-size: 2rem;
            font-weight: bold;
            display: block;
            color: #ff9f43;
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #ccc;
        }

        /* Texto da História Diária */
        .history-text {
            font-style: italic;
            font-size: 1rem;
            color: #ddd;
            min-height: 50px;
            margin-top: 1rem;
        }

        /* Tela Final (Escondida por padrão) */
        #final-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            animation: fadeIn 2s ease-in-out forwards;
        }

        #final-screen img {
            max-width: 80%;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        #final-screen h2 {
            margin-top: 1.5rem;
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: 3px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container" id="countdown-container">
        <h1 id="title">A Nossa História Continua...</h1>
        <div class="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Dias</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Min</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seg</span>
            </div>
        </div>
        <div class="history-text" id="history">Carregando memórias...</div>
    </div>

    <div id="final-screen">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1000" alt="Imagem Final">
        <h2>O FINAL CHEGOU! ??</h2>
    </div>

    <script>
        // Configuração do Tempo: 1 mês (considerado 30 dias nesta lógica) e 22 dias = 52 dias no total
        const DIAS_TOTAIS = 52; 
        
        // Define a data final somando os dias a partir do momento atual
        const dataFinal = new Date();
        dataFinal.setDate(dataFinal.getDate() + DIAS_TOTAIS);

        // Banco de dados simulado de imagens de fundo (Tempo) e Histórias passando dia a dia
        // Usando imagens do Unsplash representativas (Estações, passagens de tempo)
        const historicoDoTempo = [
            { texto: "O começo de uma longa e linda espera.", bg: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200" },
            { texto: "O outono cai, as folhas mudam, mas a direção é a mesma.", bg: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200" },
            { texto: "Metade do caminho. Olhando para trás, cada dia valeu a pena.", bg: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1200" },
            { texto: "Os dias ficam mais curtos, a ansiedade só aumenta.", bg: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1200" },
            { texto: "Falta muito pouco. O tempo parece voar e congelar ao mesmo tempo.", bg: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1200" },
            { texto: "É amanhã. O coração bate mais forte na última curva do caminho.", bg: "https://images.unsplash.com/photo-1501854140801-50d01698950b?q=80&w=1200" }
        ];

        function atualizarContador() {
            const agora = new Date().getTime();
            const diferenca = dataFinal - agora;

            // Se o tempo acabar
            if (diferenca <= 0) {
                clearInterval(intervalo);
                document.getElementById('countdown-container').style.display = 'none';
                document.getElementById('final-screen').style.display = 'flex';
                document.body.style.background = "#000";
                return;
            }

            // Cálculos de tempo
            const dias R = Math.floor(diferenca / (1000 * 60 * 60 * 24));
            const horasR = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutosR = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
            const segundosR = Math.floor((diferenca % (1000 * 60)) / 1000);

            // Atualiza o HTML
            document.getElementById('days').innerText = String(diasR).padStart(2, '0');
            document.getElementById('hours').innerText = String(horasR).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutosR).padStart(2, '0');
            document.getElementById('seconds').innerText = String(segundosR).padStart(2, '0');

            // Lógica para mudar a história e o fundo baseado em quantos dias faltam
            let estagio = 0;
            if (diasR <= 1) estagio = 5;       // Último dia
            else if (diasR <= 7) estagio = 4;  // Última semana
            else if (diasR <= 15) estagio = 3; // Duas semanas
            else if (diasR <= 26) estagio = 2; // Metade do tempo
            else if (diasR <= 40) estagio = 1; // Avançando
            else estagio = 0;                  // Começo

            // Aplica as mudanças dinâmicas de cenário e texto
            document.body.style.background = `url('${historicoDoTempo[estagio].bg}') no-repeat center center/cover`;
            document.getElementById('history').innerText = historicoDoTempo[estagio].texto;
        }

        // Executa a função a cada 1 segundo
        const intervalo = setInterval(atualizarContador, 1000);
        atualizarContador(); // Executa imediatamente ao abrir
    </script>
</body>
</html>
